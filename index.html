<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آراد بهترینه</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #c62828; /* قرمز تند و شاداب */
      background: radial-gradient(circle at 30% 20%, #ef5350, #b71c1c);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 1rem;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 3.5rem 1.5rem 3.5rem 1.5rem;
      padding: 2.8rem 4.5rem;
      box-shadow: 
        0 30px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      text-align: center;
      max-width: 90vw;
      position: relative;
      overflow: hidden;
    }
    /* یک درخشش ملایم روی شیشه */
    .glass-card::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25), transparent 70%);
      pointer-events: none;
      opacity: 0.5;
    }
    .glass-card h1 {
      font-size: clamp(2.8rem, 15vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      margin: 0;
      line-height: 1.2;
      position: relative;
      z-index: 2;
      word-break: break-word;
    }
    /* یک افکت نورانی زیر متن (اختیاری) */
    .glass-card h1::after {
      content: "آراد بهترینه";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.15);
      z-index: -1;
      transform: translate(3px, 3px);
      opacity: 0.3;
    }
    /* یک المان تزئینی شیشه‌ای در پایین */
    .glass-shimmer {
      position: absolute;
      bottom: 8%;
      right: 8%;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent 70%);
      border-radius: 50%;
      filter: blur(10px);
      pointer-events: none;
      z-index: 0;
    }
    .glass-shimmer.two {
      top: 12%;
      left: 5%;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent 60%);
    }
    /* ریسپانسیو */
    @media (max-width: 500px) {
      .glass-card {
        padding: 2rem 2rem;
        border-radius: 2.5rem 1rem 2.5rem 1rem;
      }
      .glass-card h1 {
        font-size: clamp(2.4rem, 12vw, 4rem);
      }
    }
    /* یک hover ملایم برای تعامل */
    .glass-card:hover {
      transform: scale(1.02) translateY(-5px);
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      border-color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <!-- shimmer های تزئینی -->
    <div class="glass-shimmer"></div>
    <div class="glass-shimmer two"></div>
    
    <h1>آراد بهترینه</h1>
  </div>
</body>
</html>
